# Train and release model workflow
name: Train and Release Model

on:
  workflow_dispatch:
    inputs:
      model_version:
        description: "Version/tag for the model release (e.g., v1.0.0)"
        required: true
      release_notes:
        description: "Optional release notes"
        required: false
        default: "New model release"

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Train and package model
        run: scripts/train_and_package.sh "${{ github.event.inputs.model_version }}"

      - name: Create Git tag
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          TAG="${{ github.event.inputs.model_version }}"

          # Check if tag exists
          if git ls-remote --tags origin | grep -q "refs/tags/$TAG$"; then
            echo "Tag $TAG already exists"
            exit 1
          fi

          git tag -a "$TAG" -m "Model release $TAG"
          git push origin "$TAG"
          echo "Created tag $TAG"

      - name: Create GitHub release using API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.model_version }}"
          NOTES="${{ github.event.inputs.release_notes }}"

          # Create release using GitHub CLI
          gh release create "$TAG" \
            --title "Model $TAG" \
            --notes "$NOTES" \
            dist/model-artifacts.tar.gz

      - name: Make release public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # GitHub releases are public by default if repo is public
          echo "Release created and artifact uploaded"
          echo "Download URL: https://github.com/${{ github.repository }}/releases/download/${{ github.event.inputs.model_version }}/model-artifacts.tar.gz"
